<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:sans-serif;margin:0} header{height:64px;background:#eee} main{padding:20px;max-width:700px} [contenteditable]{border:1px solid #ccc;padding:8px;margin:8px 0;white-space:pre-wrap}</style></head>
<body><header>Studio</header><main>
<ytcp-video-metadata-editor>
<ytcp-video-title><div id="textbox" contenteditable="true">Minecraft maison facile</div></ytcp-video-title>
<ytcp-video-description><div id="textbox" contenteditable="true">Dans cette vidéo je construis une maison.</div></ytcp-video-description>
<ytcp-form-select id="category"><ytcp-dropdown-trigger><span class="dropdown-trigger-text">Jeux vidéo</span></ytcp-dropdown-trigger></ytcp-form-select>
<ytcp-button id="toggle-button">Afficher plus</ytcp-button>
<div id="adv"></div>
</ytcp-video-metadata-editor>
<ytcp-video-info><a href="https://youtube.com/shorts/abc123XYZ">https://youtube.com/shorts/abc123XYZ</a></ytcp-video-info>
<div class="vidiq-sidebar">vidIQ · Keyword: minecraft house · Score 72 · Search volume High · Competition Low</div>
</main>
<script>
document.getElementById('toggle-button').onclick = () => {
  if (document.getElementById('tags-container')) return;
  document.getElementById('adv').innerHTML = '<ytcp-video-metadata-editor-advanced><ytcp-form-input-container id="tags-container"><ytcp-free-text-chip-bar><div id="chips"><ytcp-chip><div id="chip-text">minecraft</div><ytcp-icon-button id="delete-icon">x</ytcp-icon-button></ytcp-chip></div><input id="text-input"></ytcp-free-text-chip-bar></ytcp-form-input-container></ytcp-video-metadata-editor-advanced>';
  const input = document.getElementById('text-input');
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && input.value.trim()) {
      const c = document.createElement('ytcp-chip');
      c.innerHTML = '<div id="chip-text"></div><ytcp-icon-button id="delete-icon">x</ytcp-icon-button>';
      c.firstChild.textContent = input.value.trim(); input.value = '';
      document.getElementById('chips').appendChild(c);
    }
  });
  document.getElementById('adv').addEventListener('click', e => { if (e.target.id === 'delete-icon') e.target.closest('ytcp-chip').remove(); });
};
</script></body></html>
